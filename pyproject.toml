[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "nasmove"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.10,<7",
  "smbprotocol>=1.15,<2",
  "keyring>=25,<27",
]

[project.scripts]
nasmove = "nasmove.ui.desktop_app:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pip-tools>=7.5,<8",
  "pytest>=8.4,<10",
  "pytest-qt>=4.5,<5",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["synology: requires an explicitly enabled isolated Synology test share"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nasmove"]
